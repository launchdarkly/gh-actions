name: 'Verify Hello App'
description: 'Ensure a hello-app style script outputs the expected response'
inputs:
  command:
    description: 'Command to run the hello-app'
    required: true
  role_arn:
    description: 'AWS role ARN used to pull SDK keys'
    required: true
  use_server_key:
    description: 'Populate LAUNCHDARKLY_SDK_KEY with a server-side SDK key if true'
    required: false
    default: 'false'
  use_client_key:
    description: 'Populate LAUNCHDARKLY_CLIENT_SIDE_ID with a client-side ID if true'
    required: false
    default: 'false'
  use_mobile_key:
    description: 'Populate LAUNCHDARKLY_MOBILE_KEY with a mobile key if true'
    required: false
    default: 'false'


runs:
  using: composite

  steps:
    - uses: launchdarkly/gh-actions/actions/release-secrets@release-secrets-v1.2.0
      if: ${{ inputs.use_server_key == 'true' }}
      name: 'Get the server SDK key'
      with:
        aws_assume_role: ${{ inputs.role_arn }}
        ssm_parameter_pairs: '/sdk/common/hello-apps/server-key = LAUNCHDARKLY_SDK_KEY'

    - uses: launchdarkly/gh-actions/actions/release-secrets@release-secrets-v1.2.0
      if: ${{ inputs.use_client_key == 'true' }}
      name: 'Get the client SDK key'
      with:
        aws_assume_role: ${{ inputs.role_arn }}
        ssm_parameter_pairs: '/sdk/common/hello-apps/client-key = LAUNCHDARKLY_CLIENT_SIDE_ID'

    - uses: launchdarkly/gh-actions/actions/release-secrets@release-secrets-v1.2.0
      if: ${{ inputs.use_mobile_key == 'true' }}
      name: 'Get the mobile SDK key'
      with:
        aws_assume_role: ${{ inputs.role_arn }}
        ssm_parameter_pairs: '/sdk/common/hello-apps/mobile-key = LAUNCHDARKLY_MOBILE_KEY'

    - uses: launchdarkly/gh-actions/actions/release-secrets@release-secrets-v1.2.0
      name: 'Get the test feature flag key'
      with:
        aws_assume_role: ${{ inputs.role_arn }}
        ssm_parameter_pairs: '/sdk/common/hello-apps/boolean-flag-key = LAUNCHDARKLY_FLAG_KEY'

    - name: 'Run hello-app command'
      shell: bash
      run: |
        # GitHub runs a composite `shell: bash` step as
        # `bash --noprofile --norc -e -o pipefail`. Capturing the command with
        # `output=$(...)` therefore ended the step as soon as the command
        # failed, before anything could report why, so a failing run logged
        # only "Process completed with exit code 1". Streaming through tee
        # keeps the output in the log as it is produced, which also covers a
        # command that hangs and gets cancelled.
        log="$(mktemp)"

        # The command runs in a subshell so that a `cd` or a `set -e` inside a
        # caller's multi-line command stays contained, as it did under the
        # previous command substitution. `set +e` lets a failure reach the
        # check below instead of ending the step, and PIPESTATUS reports the
        # command's own status rather than tee's.
        set +e
        (
        ${{ inputs.command }}
        ) 2>&1 | tee "$log"
        status=${PIPESTATUS[0]}
        set -e

        if [ "$status" -ne 0 ]; then
          echo "::error::hello-app command exited with status $status. Its output is above."
          exit 1
        fi

        if ! grep -qi "feature flag evaluates to true" "$log"; then
          echo "::error::hello-app command did not produce the expected output. Its output is above."
          exit 1
        fi
