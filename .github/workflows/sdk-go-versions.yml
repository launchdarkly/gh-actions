name: Check Supported Go Versions
# Call this by uses: launchdarkly/gh-actions/.github/workflows/sdk-go-versions.yml@main
#
# The calling job must grant `contents: write` and `pull-requests: write`. A reusable
# workflow can only narrow the permissions it is handed, and `check-go-eol` narrows itself
# to `contents: read`.

on:
  workflow_call:
    inputs:
      branches:
        description: 'JSON array of branches to open bump pull requests against, e.g. ''["v7"]'' or ''["v3", "v4"]''.'
        required: true
        type: string
      precision:
        description: "'cycle' to track the major.minor version (1.27), or 'latest' to track the patch version (1.27.0)."
        required: false
        default: cycle
        type: string
      versions_file:
        description: 'Path to the file holding the current `latest=` and `penultimate=` values.'
        required: false
        default: .github/variables/go-versions.env
        type: string
      update_script:
        description: 'Optional script, invoked as `<script> <latest> <penultimate>`. When empty, `latest=` and `penultimate=` in versions_file are rewritten in place.'
        required: false
        default: ''
        type: string
      add_paths:
        description: 'Newline-separated list of paths to include in the pull request. Set this when update_script touches more than versions_file.'
        required: false
        default: .github/variables/go-versions.env
        type: string
      pr_title_prefix:
        description: 'Conventional-commit prefix for the pull request title, e.g. "ci" or "fix(deps)".'
        required: false
        default: ci
        type: string
      runs_on:
        description: 'Runner specification'
        required: false
        default: ubuntu-latest
        type: string

jobs:
  check-go-eol:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      latest: ${{ steps.go-versions.outputs.latest }}
      penultimate: ${{ steps.go-versions.outputs.penultimate }}
    steps:
      - name: Fetch officially supported Go versions
        id: go-versions
        uses: launchdarkly/gh-actions/actions/go-eol-versions@main
        with:
          precision: ${{ inputs.precision }}

  create-prs:
    needs: check-go-eol
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        branch: ${{ fromJSON(inputs.branches) }}
      fail-fast: false
    env:
      officialLatest: ${{ needs.check-go-eol.outputs.latest }}
      officialPenultimate: ${{ needs.check-go-eol.outputs.penultimate }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      # Read the versions the branch is currently on, so the run can tell whether there is
      # anything to do and can describe the change in the commit message.
      - name: Get current Go versions
        id: current
        env:
          VERSIONS_FILE: ${{ inputs.versions_file }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          for key in latest penultimate; do
            value=$(grep -E "^${key}=" "$VERSIONS_FILE" | head -1 | cut -d= -f2- | tr -d '[:space:]')
            if [ -z "$value" ]; then
              echo "::error::No ${key}= entry found in $VERSIONS_FILE on $BRANCH"
              exit 1
            fi
            echo "${key}=${value}" >>"$GITHUB_OUTPUT"
          done

      - name: Update Go versions
        if: steps.current.outputs.latest != env.officialLatest
        id: update
        env:
          VERSIONS_FILE: ${{ inputs.versions_file }}
          UPDATE_SCRIPT: ${{ inputs.update_script }}
        run: |
          set -euo pipefail
          if [ -n "$UPDATE_SCRIPT" ]; then
            "$UPDATE_SCRIPT" "$officialLatest" "$officialPenultimate"
          else
            # Anchored so a `min=` line, or anything else in the file, is left alone.
            sed -i -e "s#^latest=.*#latest=$officialLatest#" \
                   -e "s#^penultimate=.*#penultimate=$officialPenultimate#" \
                   "$VERSIONS_FILE"
          fi

      - name: Create pull request
        if: steps.update.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: ${{ inputs.add_paths }}
          branch: "launchdarklyreleasebot/update-to-go${{ needs.check-go-eol.outputs.latest }}-${{ matrix.branch }}"
          author: "LaunchDarklyReleaseBot <LaunchDarklyReleaseBot@launchdarkly.com>"
          committer: "LaunchDarklyReleaseBot <LaunchDarklyReleaseBot@launchdarkly.com>"
          labels: ${{ matrix.branch }}
          title: "${{ inputs.pr_title_prefix }}: bump supported Go versions to ${{ needs.check-go-eol.outputs.latest }} and ${{ needs.check-go-eol.outputs.penultimate }}"
          commit-message: "Bumps from Go ${{ steps.current.outputs.latest }} -> ${{ needs.check-go-eol.outputs.latest }} and ${{ steps.current.outputs.penultimate }} -> ${{ needs.check-go-eol.outputs.penultimate }}."
          body: |
            A new upstream Go release means this repository's supported versions are behind.

            Go ships a major release roughly every six months and supports the two most
            recent, so this branch should track them.

            |             | Current      | Desired                                                                                                                 |
            |-------------|--------------|-------------------------------------------------------------------------------------------------------------------------|
            | Latest      | ${{ steps.current.outputs.latest }}      | [${{ needs.check-go-eol.outputs.latest }}](https://go.dev/doc/devel/release#go${{ needs.check-go-eol.outputs.latest }})           |
            | Penultimate | ${{ steps.current.outputs.penultimate }} | [${{ needs.check-go-eol.outputs.penultimate }}](https://go.dev/doc/devel/release#go${{ needs.check-go-eol.outputs.penultimate }}) |

            Opened by [sdk-go-versions](https://github.com/launchdarkly/gh-actions/blob/main/.github/workflows/sdk-go-versions.yml).

            - [ ] I have triggered CI on this PR (either close & reopen this PR in Github UI, or `git commit -m "run ci" --allow-empty && git push`)
